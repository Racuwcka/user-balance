version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: user_balance_postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: user_balance_app
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - ./.env:/app/.env

volumes:
  postgres_data:
