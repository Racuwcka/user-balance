version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: user_balance_postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - new

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: user_balance_app
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - ./.env:/app/.env
    networks:
      - new

  migrate:
    image: migrate/migrate
    networks:
      - new
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  new:
